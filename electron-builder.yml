appId: org.vocesdelaextincion.playerinterface
productName: player-interface
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Vite inlines audio/images/fonts into out/renderer/assets as hashed files, so shipping
  # the sources too would just double the package size.
  - '!{media,content,scripts,build}/*'
  - '!{ARCHITECTURE.md,DESIGN.md,STAGES.md,directive.md}'
asarUnpack:
  - resources/**
win:
  executableName: player-interface
  # ia32 as well as x64: the kiosk is a Windows 8 machine and may well be 32-bit. Electron 22
  # still ships both. An ia32 build also runs on x64 Windows, so it's the safe one if nobody
  # can confirm the architecture.
  # zip is the kiosk deliverable (unpack, run the .exe — no installer, no admin rights) and
  # is the only one of the two that builds off-Windows. nsis needs wine or a Windows box.
  target:
    - target: zip
      arch: [x64, ia32]
    - target: nsis
      arch: [x64, ia32]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Staff install this on a shared museum machine; let them pick the drive and
  # avoid a per-user install that a different Windows login can't see.
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # AppImage only. The deb target additionally requires a maintainer email, which nobody has
  # supplied — set `author` to `{ name, email }` in package.json (or `linux.maintainer` here)
  # and add `deb` back if a Debian package is ever wanted. AppImage is self-contained and needs
  # no install, which suits the kiosk better anyway.
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
